<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Todo</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <h1>Todo</h1>

    <form id="todo-form">
      <input id="title" placeholder="Enter a new todo" required autocomplete="off" />

      <button type="submit" class="new">Add</button>
      <button type="submit">Update</button>
    </form>

    <ul id="todos"></ul>
  </main>

  <script src="/app.js"></script>
</body>
</html>
